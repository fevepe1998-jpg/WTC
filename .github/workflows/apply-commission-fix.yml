          # 2) Add partial commission payment status.
          replace_once(
              'Gc={aprobada:{label:"Aprobada",bg:"#ECFDF3",color:"#166534"},pendiente:{label:"Pendiente",bg:"#FFFBEB",color:"#92400E"},bloqueada:{label:"Bloqueada",bg:"#F5F3FF",color:"#5B21B6"},anulada:{label:"Anulada",bg:"#FEF2F2",color:"#991B1B"},pagada:{label:"Pagada",bg:"#F0FDF4",color:"#14532D"}}',
