              'i=["Dashboard","Pedidos","Lotes","Productos","Vendedores","Usuarios"],o={Dashboard:"layout-dashboard",Pedidos:"shopping-cart",Lotes:"layers-subtract",Productos:"package",Vendedores:"users",Usuarios:"shield"}',
