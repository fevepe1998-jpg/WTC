          replace_once(
              'ee=t=>t?t>=1e6?"$"+(t/1e6).toFixed(1)+"M":"$"+Math.round(t/1e3)+"K":"$0"',
              'ee=t=>"$"+Math.round(t||0).toLocaleString("es-CO")',
              'full currency formatter'
