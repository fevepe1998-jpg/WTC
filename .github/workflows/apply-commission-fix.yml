name: Apply commission payment improvements

on:
  push:
    paths:
      - '.github/workflows/apply-commission-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
