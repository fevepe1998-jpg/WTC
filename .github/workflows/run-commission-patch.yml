name: Run commission frontend patch

on:
  push:
    paths:
      - '.github/workflows/run-commission-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/apply-commission-fix.yml').read_text(encoding='utf-8')
          code = source.split("python <<'PY'\n", 1)[1].rsplit("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(code), 'commission_patch.py', 'exec'))
          PY
      - name: Commit frontend changes
        run: |
          git config user.name "OpenAI"
          git config user.email "openai-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add commission payment ledger and full COP amounts"
          git push origin HEAD:main
